{% extends "base.html" %}
{% block title %}
    <title>學生資料管理系統-修改學生資料</title>
{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-warm mb-0">修改學生資料</h2>
        <a href="{% url 'index' %}" class="btn btn-outline-warm">回首頁</a>
    </div>
    <div class="card-warm p-4">
        {% comment %} <form action="/edit/{{ obj_data.cid }}/" method="POST"> <!-- 傳統寫法 --> {% endcomment %}
        <form action="{% url 'edit' id=obj_data.cid %}" method="POST"> <!-- 別名寫法 -->
            {% csrf_token %}
            <!-- 表單內容, 預設值使用 obj_data 的資料 -->
            <div class="row mb-3">
                <label for="cname" class="col-sm-2 col-form-label">*姓名</label>
                <div class="col-sm-10">
                    <input type="text" id="cname" name="cname" class="form-control" required placeholder="請輸入姓名" value="{{ obj_data.cname }}">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">*性別</label>
                <div class="col-sm-10 d-flex align-items-center gap-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="csex_m" name="csex" value="M" {% if obj_data.csex == 'M' %}checked{% endif %}>
                        <label class="form-check-label" for="csex_m">男</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" id="csex_f" name="csex" value="F" {% if obj_data.csex == 'F' %}checked{% endif %}>
                        <label class="form-check-label" for="csex_f">女</label>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <label for="cbirthday" class="col-sm-2 col-form-label">*生日</label>
                <div class="col-sm-10">
                    <input type="date" id="cbirthday" name="cbirthday" class="form-control" required value="{{ obj_data.cbirthday|date:'Y-m-d' }}">
                </div>
            </div>
            <div class="row mb-3">
                <label for="cemail" class="col-sm-2 col-form-label">*信箱</label>
                <div class="col-sm-10">
                    <input type="email" id="cemail" name="cemail" class="form-control" required placeholder="請輸入mail" value="{{ obj_data.cemail }}">
                </div>
            </div>
            <div class="row mb-3">
                <label for="cphone" class="col-sm-2 col-form-label">電話</label>
                <div class="col-sm-10">
                    <input type="text" id="cphone" name="cphone" class="form-control" value="{{ obj_data.cphone }}">
                </div>
            </div>
            <div class="row mb-4">
                <label for="caddr" class="col-sm-2 col-form-label">地址</label>
                <div class="col-sm-10">
                    <input type="text" id="caddr" name="caddr" class="form-control" value="{{ obj_data.caddr }}">
                </div>
            </div>
            <div class="text-center">
                <input type="submit" name="button" id="button" value="儲存" class="btn btn-warm px-4">
                <input type="reset" name="button2" id="button2" value="清除" class="btn btn-outline-secondary px-4">
            </div>
        </form>
    </div>
{% endblock %}
